<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .bg { fill: #171717; stroke: #FFE500; stroke-width: 4px; }
      .letter { fill: #F5F0E6; }
      .period { fill: #FFE500; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #FFE500; stroke: #171717; stroke-width: 4px; }
        .letter { fill: #171717; }
        .period { fill: #171717; }
      }
    </style>
  </defs>
  <rect class="bg" x="3" y="3" width="58" height="58" rx="0" />
  <!-- Geometric N monogram -->
  <polygon class="letter" points="14,16 22,16 34,38 34,16 42,16 42,48 34,48 22,26 22,48 14,48" />
  <!-- Signature Neo Yellow Period -->
  <rect class="period" x="46" y="40" width="8" height="8" />
</svg>